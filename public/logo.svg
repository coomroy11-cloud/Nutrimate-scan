<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nTealGrad" x1="20" y1="20" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C5E7D" />
      <stop offset="100%" stop-color="#257A9E" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="40" y1="35" x2="68" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48C774" />
      <stop offset="60%" stop-color="#2CA860" />
      <stop offset="100%" stop-color="#1E8A4C" />
    </linearGradient>
    <linearGradient id="rightCurveGrad" x1="55" y1="45" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ABBA7" />
      <stop offset="100%" stop-color="#329E8E" />
    </linearGradient>
  </defs>

  <!-- Left Vertical Stem of N -->
  <rect x="20" y="28" width="13" height="54" rx="6.5" fill="url(#nTealGrad)" />

  <!-- Top Arch of N -->
  <path d="M 26.5 28 C 30 18, 52 18, 60 36 C 63 43, 63 56, 56 66 C 50 74, 42 75, 36 72" fill="none" stroke="url(#nTealGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Leaf Nestled in N -->
  <path d="M 40 40 C 58 35, 68 52, 65 72 C 45 74, 34 60, 40 40 Z" fill="url(#leafGrad)" />
  <path d="M 43 45 C 48 55, 54 62, 63 68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- Right Upward Curve -->
  <path d="M 52 74 C 64 77, 79 72, 79 56 L 79 38" fill="none" stroke="url(#rightCurveGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Particle 1: Teal Dot -->
  <circle cx="68" cy="28" r="4.5" fill="#38B2AC" />
  <circle cx="68" cy="28" r="2" fill="#E6FFFA" opacity="0.6" />

  <!-- Particle 2: Sparkle Star -->
  <g transform="translate(80, 16)">
    <circle cx="0" cy="0" r="6" fill="#84CC16" opacity="0.9" />
    <circle cx="0" cy="0" r="3.5" fill="#FEF08A" />
    <path d="M 0 -7.5 L 0 7.5 M -7.5 0 L 7.5 0" stroke="#65A30D" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
